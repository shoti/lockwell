version = 1
SPDX-PackageName = "Lockwell"
SPDX-PackageSupplier = "Shota Mtvarelishvili <mtvarelishvili@proton.me>"

# Guides, articles, pages and UI text (see LICENSE-CONTENT.md).
[[annotations]]
path = "content/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Shota Mtvarelishvili <mtvarelishvili@proton.me>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Images: icons and Open Graph pictures (see LICENSE-CONTENT.md).
[[annotations]]
path = ["src/public/*.png", "src/public/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Shota Mtvarelishvili <mtvarelishvili@proton.me>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# FiraGO fonts, subset for this site (see src/public/fonts/OFL.txt).
[[annotations]]
path = "src/public/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2012-2018 Carrois Corporate GbR, HERE Europe B.V., The Mozilla Foundation, Telefonica S.A. and bBox Type GmbH"
SPDX-License-Identifier = "OFL-1.1"

# Configuration files in formats without comments.
[[annotations]]
path = ["package.json", "jsconfig.json", ".nvmrc"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Shota Mtvarelishvili <mtvarelishvili@proton.me>"
SPDX-License-Identifier = "MIT"
