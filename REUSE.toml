# Copyright and license for every file in the repository, in one place
# (REUSE specification 3.3, https://reuse.software/spec-3.3/), so files need
# no header of their own. When several tables match a file, the last one wins.
# License texts are in LICENSES/; LICENSE and LICENSE-CONTENT.md are the
# human-readable notices.

version = 1
SPDX-PackageName = "Lockwell"

# Code, configuration and documentation (see LICENSE).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Shota Mtvarelishvili and Lockwell contributors"
SPDX-License-Identifier = "MIT"

# Guides, articles, pages and UI text (see LICENSE-CONTENT.md).
[[annotations]]
path = "content/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Shota Mtvarelishvili and Lockwell contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Images: icons and Open Graph pictures (see LICENSE-CONTENT.md).
[[annotations]]
path = ["src/public/*.png", "src/public/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Shota Mtvarelishvili and Lockwell contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# FiraGO fonts, subset for this site (see src/public/fonts/OFL.txt).
[[annotations]]
path = "src/public/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2012-2018 Carrois Corporate GbR, HERE Europe B.V., The Mozilla Foundation, Telefonica S.A. and bBox Type GmbH"
SPDX-License-Identifier = "OFL-1.1"

# The Public Suffix List, compacted by scripts/update-psl.mjs (see https://publicsuffix.org/).
[[annotations]]
path = ["src/client/public-suffix.mjs", "src/client/top-level-domains.mjs"]
precedence = "override"
SPDX-FileCopyrightText = "Mozilla Foundation and Public Suffix List contributors"
SPDX-License-Identifier = "MPL-2.0"

# EFF's long word list for passphrases (see https://www.eff.org/copyright).
[[annotations]]
path = "src/client/wordlist-en.mjs"
precedence = "override"
SPDX-FileCopyrightText = "Electronic Frontier Foundation"
SPDX-License-Identifier = "CC-BY-4.0"

# Mozilla's PDF.js, vendored unchanged by scripts/update-pdfjs.mjs for the PDF tools' previews (see VERSION there).
[[annotations]]
path = "src/vendor/pdfjs/**"
precedence = "override"
SPDX-FileCopyrightText = "Mozilla Foundation and PDF.js contributors"
SPDX-License-Identifier = "Apache-2.0"

# PDF.js's JPEG 2000 decoder: OpenJPEG compiled to JavaScript (see LICENSE_OPENJPEG and LICENSE_PDFJS_OPENJPEG there).
[[annotations]]
path = "src/vendor/pdfjs/openjpeg_nowasm_fallback.js"
precedence = "override"
SPDX-FileCopyrightText = ["2002-2014 Université catholique de Louvain (UCL) and the OpenJPEG contributors", "2024 Mozilla Foundation"]
SPDX-License-Identifier = "BSD-2-Clause"

# PDF.js's JBIG2 decoder: PDFium's compiled to JavaScript (see LICENSE_JBIG2 and LICENSE_PDFJS_JBIG2 there).
[[annotations]]
path = "src/vendor/pdfjs/jbig2_nowasm_fallback.js"
precedence = "override"
SPDX-FileCopyrightText = ["2014 The PDFium Authors", "2026 Mozilla Foundation"]
SPDX-License-Identifier = "BSD-3-Clause AND Apache-2.0"

# Adobe's character maps, as PDF.js ships them, wrapped as modules (see cmaps/LICENSE there).
[[annotations]]
path = "src/vendor/pdfjs/cmaps/**"
precedence = "override"
SPDX-FileCopyrightText = "1990-2009 Adobe Systems Incorporated"
SPDX-License-Identifier = "BSD-3-Clause"
