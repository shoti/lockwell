# Monthly: is the vendored copy of Mozilla's PDF.js (src/vendor/pdfjs/, used only by the PDF tools page to draw
# previews) still the latest release? Dependabot cannot see vendored files, so this job compares the version in
# src/vendor/pdfjs/VERSION with the latest pdfjs-dist on npm and opens one issue when a newer release exists.
# To update: node scripts/update-pdfjs.mjs (see its header), then npm run check.
name: PDF.js update check

on:
  schedule:
    - cron: '23 7 3 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compare with the latest release
        id: compare
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const ours = /^pdfjs-dist (\d+\.\d+\.\d+)$/m.exec(readFileSync("src/vendor/pdfjs/VERSION", "utf8"))?.[1];
            if (!ours) throw new Error("src/vendor/pdfjs/VERSION has no \"pdfjs-dist x.y.z\" line: was it edited by hand?");
            const response = await fetch("https://registry.npmjs.org/pdfjs-dist/latest");
            if (!response.ok) throw new Error(`The npm registry answered ${response.status} for pdfjs-dist/latest`);
            const latest = (await response.json()).version;
            const parts = (v) => v.split(".").map(Number);
            const [a, b] = [parts(ours), parts(latest)];
            const newer = b[0] - a[0] || b[1] - a[1] || b[2] - a[2];
            console.log(`Vendored PDF.js ${ours}; latest release ${latest}.`);
            appendFileSync(process.env.GITHUB_OUTPUT, `ours=${ours}\nlatest=${latest}\nnewer=${newer > 0}\n`);
          '
      - name: Open an issue (once per release)
        if: steps.compare.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OURS: ${{ steps.compare.outputs.ours }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          title="Update PDF.js from $OURS to $LATEST"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An issue for $LATEST already exists."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The PDF tools page uses a vendored copy of Mozilla's PDF.js $OURS (src/vendor/pdfjs/VERSION). Release $LATEST is out: https://github.com/mozilla/pdf.js/releases

          Read the release notes for security fixes, then: change PINNED in scripts/update-pdfjs.mjs and PDFJS_VERSION in src/client/pdf-view.mjs, run \`node scripts/update-pdfjs.mjs\`, review the diff and run \`npm run check\`. Check the previews in a real browser before merging."
