# Weekly checks that don't depend on a code change: outside links still work, and no time-sensitive
# claim in data/claims.json is overdue. Separate from CI because other sites' outages shouldn't block a PR.
name: Links and claims

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Claims registry (fails when a claim is overdue)
        run: npm run audit:claims
      - name: External links
        run: npm run audit:links
