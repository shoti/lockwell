# CI: tests, type check and build for pull requests and for main.
# Deployment is done by Cloudflare Pages, which builds main on its own.
name: CI

# Pull requests and main only: running on every branch push as well ran each check twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test
        run: npm test
      - name: Type check (tools installed for this run only; not project dependencies)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts typescript@7.0.2 @types/node@22.20.5
          npx tsc -p jsconfig.json
      - name: Build (fails on any content error)
        run: npm run build
