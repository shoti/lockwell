  <rect x="180" y="45.6" width="160" height="84" rx="4" class="box"/>
  <rect x="194" y="59.6" width="120" height="4" rx="2" class="fill-muted"/>
  <rect x="191" y="71.6" width="138" height="14" rx="2" class="fill-ink"/>
  <rect x="194" y="93.6" width="110" height="4" rx="2" class="fill-muted"/>
  <rect x="194" y="110.6" width="90" height="4" rx="2" class="fill-muted"/>
  <text x="170" y="150.1" class="t-sm t-muted" text-anchor="middle">ეკრანზე ორივე ერთნაირად ჩანს.</text>
  <line x1="80" y1="160.8" x2="80" y2="175.8" class="line"/>
  <polygon points="80,182.8 84.2,175.8 75.8,175.8" class="fill-muted"/>
  <line x1="260" y1="160.8" x2="260" y2="175.8" class="line"/>
