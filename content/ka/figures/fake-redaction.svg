<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 265">
  <title>ორი დაფარვა, რომლებიც ერთნაირად გამოიყურება</title>
  <desc>ეკრანზე ორივე ერთნაირად ჩანს. მონიშნეთ და დააკოპირეთ, რაც მართკუთხედის ქვეშაა: ზემოდან დახატული მართკუთხედი: წყაროს სახელი. ტექსტი ფაილში დარჩა. დაფარვის ხელსაწყო: არაფერი. ტექსტი წაიშალა.</desc>
  <text x="0" y="14.4" class="t-b t-bad">ზემოდან დახატული</text>
  <text x="0" y="34.2" class="t-b t-bad">მართკუთხედი</text>
  <text x="180" y="14.4" class="t-b t-good">დაფარვის ხელსაწყო</text>
  <rect x="0" y="45.6" width="160" height="84" rx="4" class="box"/>
  <rect x="14" y="59.6" width="120" height="4" rx="2" class="fill-muted"/>
