  <rect x="0" y="186.8" width="160" height="78.1" rx="8" class="box-bad"/>
  <text x="80" y="211.2" class="t-b t-bad" text-anchor="middle">წყაროს სახელი</text>
  <text x="80" y="233" class="t-sm" text-anchor="middle">ტექსტი ფაილში</text>
  <text x="80" y="250.2" class="t-sm" text-anchor="middle">დარჩა</text>
  <rect x="180" y="186.8" width="160" height="78.1" rx="8" class="box-good"/>
  <text x="260" y="211.2" class="t-b t-good" text-anchor="middle">არაფერი</text>
