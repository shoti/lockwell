<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 369">
  <title>რას ცვლის ჩატბოტის კონფიდენციალურობის სამი პარამეტრი და რას — ვერა</title>
  <desc>სწავლების გამორთვა: მიმოწერას მოდელის გასაუმჯობესებლად აღარ იყენებენ, თუმცა ის მაინც ინახება და თანამშრომლებს მასზე წვდომა მაინც შეიძლება ჰქონდეთ. დროებითი ჩატი: ისტორიაში არ ჩანს და სასწავლად არ გამოიყენება, მაგრამ ასლი შეიძლება 30 დღემდე შეინახონ ChatGPT-ში ან ინახება 72 საათი Gemini-ში. საუბრის წაშლა: მიმოწერა თქვენი ანგარიშიდან იშლება, თუმცა კომპანიის სერვერებიდან წაშლას შეიძლება 30 დღემდე დასჭირდეს, ზოგი ასლი კი უფრო დიდხანსაც დარჩეს.</desc>
  <rect x="0" y="0" width="340" height="116.8" rx="8" class="box"/>
  <text x="14" y="23" class="t-b">მოდელის სწავლების გამორთვა</text>
  <path d="M14 40 L18 44 L25 35" class="line-good"/>
  <text x="36" y="44" class="t-sm">მიმოწერას მოდელის გასაუმჯობესებლად</text>
  <text x="36" y="61.2" class="t-sm">აღარ იყენებენ.</text>
  <path d="M15 75.4 L24 84.4 M24 75.4 L15 84.4" class="line-bad"/>
  <text x="36" y="84.4" class="t-sm">ის მაინც ინახება და თანამშრომლებს</text>
  <text x="36" y="101.6" class="t-sm">მასზე წვდომა მაინც შეიძლება ჰქონდეთ.</text>
  <rect x="0" y="124.8" width="340" height="116.8" rx="8" class="box"/>
  <text x="14" y="147.8" class="t-b">დროებითი ჩატი</text>
  <path d="M14 164.8 L18 168.8 L25 159.8" class="line-good"/>
  <text x="36" y="168.8" class="t-sm">ისტორიაში არ ჩანს და სასწავლად არ</text>
  <text x="36" y="186" class="t-sm">გამოიყენება.</text>
  <path d="M15 200.2 L24 209.2 M24 200.2 L15 209.2" class="line-bad"/>
  <text x="36" y="209.2" class="t-sm">ასლი შეიძლება 30 დღემდე შეინახონ</text>
  <text x="36" y="226.4" class="t-sm">(ChatGPT) ან ინახება 72 საათი (Gemini).</text>
  <rect x="0" y="249.6" width="340" height="116.8" rx="8" class="box"/>
  <text x="14" y="272.6" class="t-b">საუბრის წაშლა</text>
  <path d="M14 289.6 L18 293.6 L25 284.6" class="line-good"/>
  <text x="36" y="293.6" class="t-sm">მიმოწერა თქვენი ანგარიშიდან იშლება.</text>
  <path d="M15 307.8 L24 316.8 M24 307.8 L15 316.8" class="line-bad"/>
  <text x="36" y="316.8" class="t-sm">კომპანიის სერვერებიდან წაშლას შეიძლება</text>
  <text x="36" y="334" class="t-sm">30 დღემდე დასჭირდეს, ზოგი ასლი კი</text>
  <text x="36" y="351.2" class="t-sm">უფრო დიდხანს ინახება.</text>
</svg>
