<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 528">
  <title>რომელი ჩატებია სტანდარტულად End-to-end დაშიფრული</title>
  <desc>მდგომარეობა 2026 წლის ნოემბერში. Signal: დიახ, ყველა შეტყობინება და ზარი, ყოველთვის. WhatsApp: დიახ, პირადი ჩატები და ზარები; სარეზერვო ასლები მხოლოდ მაშინ, თუ ჩართავთ. Viber: დიახ, პირადი და ჯგუფური ჩატები; Community, Channel და ჯგუფური ზარები — არა. Messenger: შეამოწმეთ ჩატი; პირადი ჩატებისა და ზარებისთვის ავტომატურად ირთვება, თუმცა Meta-ს თქმით, დანერგვა ჯერ არ დასრულებულა. Telegram: მხოლოდ Secret Chat, რომელსაც ხელით ხსნით; ჩვეულებრივი ჩატები და ჯგუფები — არა. Instagram და SMS: არა.</desc>
  <text x="0" y="13" class="t-sm t-b t-muted">სტანდარტულად End-to-end დაშიფრულია?</text>
  <text x="0" y="30.2" class="t-sm t-b t-muted">(2026 წლის ნოემბრის მონაცემებით)</text>
