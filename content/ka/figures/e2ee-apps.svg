  <text x="328" y="392" class="t-sm t-b t-warn" text-anchor="end">მხოლოდ Secret Chat</text>
  <text x="44" y="410.8" class="t-sm">ირთვება ხელით. ჩვეულებრივი ჩატები და</text>
  <text x="44" y="428" class="t-sm">ჯგუფები End-to-end დაშიფრული არ არის.</text>
  <rect x="0" y="451.2" width="340" height="74.2" rx="8" class="box"/>
