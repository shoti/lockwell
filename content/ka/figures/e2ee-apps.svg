  <circle cx="22" cy="68.7" r="10" class="box-good"/>
  <path d="M17.5 68.7 L21 72.2 L27 65.2" class="line-good"/>
  <text x="44" y="63.2" class="t-b">Signal</text>
  <text x="328" y="63.2" class="t-sm t-b t-good" text-anchor="end">დიახ</text>
  <text x="44" y="82" class="t-sm">ყველა შეტყობინება და ზარი, ყოველთვის.</text>
