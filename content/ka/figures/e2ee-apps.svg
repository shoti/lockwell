  <circle cx="22" cy="315.3" r="10" class="box-warn"/>
  <path d="M17.5 315.29999999999995 H26.5" class="line-warn"/>
  <text x="44" y="292.6" class="t-b">Messenger</text>
  <text x="328" y="292.6" class="t-sm t-b t-warn" text-anchor="end">შეამოწმეთ ჩატი</text>
  <text x="44" y="311.4" class="t-sm">პირადი ჩატებისა და ზარებისთვის</text>
  <text x="44" y="328.6" class="t-sm">ავტომატურად ირთვება, თუმცა Meta-ს</text>
  <text x="44" y="345.8" class="t-sm">თქმით, დანერგვა ჯერ არ დასრულებულა.</text>
  <rect x="0" y="369" width="340" height="74.2" rx="8" class="box"/>
  <circle cx="22" cy="406.1" r="10" class="box-warn"/>
  <path d="M17.5 406.0999999999999 H26.5" class="line-warn"/>
