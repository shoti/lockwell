  <text x="328" y="128.2" class="t-sm t-b t-good" text-anchor="end">დიახ</text>
  <text x="44" y="147" class="t-sm">პირადი ჩატები და ზარები. სარეზერვო</text>
  <text x="44" y="164.2" class="t-sm">ასლები — მხოლოდ ხელით ჩართვისას.</text>
  <rect x="0" y="187.4" width="340" height="74.2" rx="8" class="box"/>
  <circle cx="22" cy="224.5" r="10" class="box-good"/>
  <path d="M17.5 224.49999999999997 L21 227.99999999999997 L27 220.99999999999997" class="line-good"/>
  <text x="44" y="210.4" class="t-b">Viber</text>
  <text x="328" y="210.4" class="t-sm t-b t-good" text-anchor="end">დიახ</text>
  <text x="44" y="229.2" class="t-sm">პირადი და ჯგუფური ჩატები. Community,</text>
  <text x="44" y="246.4" class="t-sm">Channel და ჯგუფური ზარები — არა.</text>
