<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 279">
  <title>რომელ საფრთხეს მოეკიდოთ სერიოზულად პირველ რიგში</title>
  <desc>იშვიათი, მაგრამ მძიმე: თქვენი არჩევანია: ზოგი თავს მაინც იცავს, რაც არ უნდა ნაკლებად სავარაუდო იყოს სავარაუდო და მძიმე: აქედან დაიწყეთ იშვიათი და უვნებელი: ახლა გვერდზე გადადეთ სავარაუდო, მაგრამ უვნებელი: ნაკლები პრიორიტეტი</desc>
  <rect x="38" y="0" width="148" height="143.1" rx="8" class="box-warn"/>
  <text x="48" y="22.5" class="t-sm t-b t-warn">იშვიათი, მაგრამ</text>
  <text x="48" y="39.6" class="t-sm t-b t-warn">მძიმე</text>
  <text x="48" y="59.8" class="t-sm">თქვენი არჩევანია:</text>
  <text x="48" y="77" class="t-sm">ზოგი თავს მაინც</text>
  <text x="48" y="94.1" class="t-sm">იცავს, რაც არ უნდა</text>
  <text x="48" y="111.3" class="t-sm">ნაკლებად</text>
  <text x="48" y="128.4" class="t-sm">სავარაუდო იყოს</text>
  <rect x="192" y="0" width="148" height="143.1" rx="8" class="box-bad"/>
  <text x="202" y="22.5" class="t-sm t-b t-bad">სავარაუდო და</text>
  <text x="202" y="39.6" class="t-sm t-b t-bad">მძიმე</text>
  <text x="202" y="59.8" class="t-sm">აქედან დაიწყეთ</text>
  <rect x="38" y="149.1" width="148" height="91.6" rx="8" class="box-soft"/>
  <text x="48" y="171.6" class="t-sm t-b">იშვიათი და</text>
  <text x="48" y="188.8" class="t-sm t-b">უვნებელი</text>
  <text x="48" y="208.9" class="t-sm">ახლა გვერდზე</text>
  <text x="48" y="226.1" class="t-sm">გადადეთ</text>
  <rect x="192" y="149.1" width="148" height="91.6" rx="8" class="box-info"/>
  <text x="202" y="171.6" class="t-sm t-b t-info">სავარაუდო, მაგრამ</text>
  <text x="202" y="188.8" class="t-sm t-b t-info">უვნებელი</text>
  <text x="202" y="208.9" class="t-sm">ნაკლები</text>
  <text x="202" y="226.1" class="t-sm">პრიორიტეტი</text>
  <line x1="18" y1="240.8" x2="18" y2="11" class="line"/>
  <polygon points="18,4 13.8,11 22.2,11" class="fill-muted"/>
  <text x="12" y="120.4" class="t-sm t-b" text-anchor="middle" transform="rotate(-90 12 120.4)">რამდენად მძიმე იქნება</text>
  <line x1="38" y1="252.8" x2="331" y2="252.8" class="line"/>
  <polygon points="338,252.8 331,248.6 331,257" class="fill-muted"/>
  <text x="189" y="272.8" class="t-sm t-b" text-anchor="middle">რამდენად სავარაუდოა</text>
