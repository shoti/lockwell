<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 408">
  <title>როგორ ითვისებენ ანგარიშს მიმოწერის აპლიკაციაში და რა აჩერებს ამას</title>
  <desc>ვიღაც თქვენს ნომერს აპლიკაციაში საკუთარ ტელეფონზე წერს. აპლიკაცია შესვლის კოდს თქვენ გიგზავნით. შეტყობინებაში კოდის გადაგზავნას გთხოვენ. ხშირად ისეთი მეგობრისგან, რომლის ანგარიშიც უკვე მოიპარეს. PIN კოდის ან პაროლის გარეშე კოდი საკმარისია. ანგარიში მათ ხელშია. PIN კოდით ან პაროლით მარტო კოდი არ კმარა. ანგარიშში ვერ შედიან.</desc>
  <rect x="0" y="0" width="340" height="63.6" rx="8" class="box"/>
  <circle cx="22" cy="31.8" r="12" class="fill-muted"/>
  <text x="22" y="36.8" class="t-b t-on" text-anchor="middle">1</text>
  <text x="44" y="26.4">ვიღაც თქვენს ნომერს აპლიკაციაში</text>
  <text x="44" y="46.2">საკუთარ ტელეფონზე წერს.</text>
  <line x1="170" y1="65.6" x2="170" y2="72.6" class="line"/>
  <polygon points="170,79.6 174.2,72.6 165.8,72.6" class="fill-muted"/>
  <rect x="0" y="81.6" width="340" height="63.6" rx="8" class="box"/>
  <circle cx="22" cy="113.4" r="12" class="fill-muted"/>
  <text x="22" y="118.4" class="t-b t-on" text-anchor="middle">2</text>
  <text x="44" y="108">აპლიკაცია შესვლის კოდს თქვენ</text>
  <text x="44" y="127.8">გიგზავნით.</text>
  <line x1="170" y1="147.2" x2="170" y2="154.2" class="line"/>
  <polygon points="170,161.2 174.2,154.2 165.8,154.2" class="fill-muted"/>
  <rect x="0" y="163.2" width="340" height="103.2" rx="8" class="box-warn"/>
  <circle cx="22" cy="214.8" r="12" class="fill-warn"/>
  <text x="22" y="219.8" class="t-b t-on" text-anchor="middle">3</text>
  <text x="44" y="189.6">შეტყობინებაში კოდის გადაგზავნას</text>
  <text x="44" y="209.4">გთხოვენ. ხშირად ისეთი</text>
  <text x="44" y="229.2">მეგობრისგან, რომლის ანგარიშიც</text>
  <text x="44" y="249">უკვე მოიპარეს.</text>
  <polyline points="170,268.4 170,276.4 82,276.4 82,279.4" class="line-bad"/>
  <polygon points="82,286.4 86.2,279.4 77.8,279.4" class="fill-bad"/>
  <polyline points="170,276.4 258,276.4 258,279.4" class="line-good"/>
  <polygon points="258,286.4 262.2,279.4 253.8,279.4" class="fill-good"/>
