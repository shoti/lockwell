  <text x="12" y="314.8" class="t-b t-bad">PIN კოდის ან</text>
  <text x="12" y="334.6" class="t-b t-bad">პაროლის გარეშე</text>
  <text x="12" y="356.5" class="t-sm">კოდი საკმარისია.</text>
  <text x="12" y="373.6" class="t-sm">ანგარიში მათ</text>
  <text x="12" y="390.8" class="t-sm">ხელშია.</text>
  <rect x="176" y="288.4" width="164" height="119.1" rx="8" class="box-good"/>
