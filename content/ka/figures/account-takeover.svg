  <text x="188" y="334.6" class="t-b t-good">პაროლით</text>
  <text x="188" y="356.5" class="t-sm">მარტო კოდი არ</text>
  <text x="188" y="373.6" class="t-sm">კმარა. ანგარიშში</text>
  <text x="188" y="390.8" class="t-sm">ვერ შედიან.</text>
</svg>
