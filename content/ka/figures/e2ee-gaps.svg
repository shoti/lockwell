  <text x="28" y="401.2" class="t-sm">შეუძლიათ ეკრანის ანაბეჭდი გადაიღონ ან</text>
  <text x="28" y="418.4" class="t-sm">ტექსტი გადააგზავნონ. ჯგუფში შეიძლება</text>
  <text x="28" y="435.6" class="t-sm">ვინმე შეცდომით დაამატონ.</text>
