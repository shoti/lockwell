<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 487">
  <title>ხუთი ადგილი, რომლებსაც End-to-end დაშიფვრა ვერ იცავს</title>
  <desc>შეტყობინება დაცულია გზაში — თქვენს ტელეფონსა და მეგობრის ტელეფონს შორის. ხუთი წერტილი ამ დაცვის მიღმა რჩება. 1, თავად ტელეფონი: მიმოწერას კითხულობს ის, ვინც ტელეფონს განბლოკავს, ან მასზე მოხვედრილი ჯაშუშური პროგრამა. 2, სარეზერვო ასლი: მეორე ასლი აპლიკაციის გარეთ, რომელიც იკითხება, თუ თავადაც დაშიფრული არ არის. 3, დაკავშირებული მოწყობილობა: ყველა ახალი შეტყობინება იქაც იგზავნება. 4, ჩატის მონაწილეები: შეუძლიათ ეკრანის ანაბეჭდი გადაიღონ ან ტექსტი გადააგზავნონ, ჯგუფში კი შეიძლება ვინმე შეცდომით დაამატონ. 5, კონვერტი (მეტამონაცემები): ვის სწერთ, როდის და რა სიხშირით.</desc>
