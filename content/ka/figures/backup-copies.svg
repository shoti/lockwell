  <title>სამი ასლი, ორი სახის საცავი, ერთი სხვა ადგილას</title>
  <desc>თქვენი კომპიუტერი: ორიგინალი. გარე დისკი: ასლის შექმნის შემდეგ გამოაერთეთ. ღრუბელი: სხვა ადგილას. 3 ასლი ყველაფრის, რაც მნიშვნელოვანია; 2 სახის საცავი (დისკები, ღრუბელი); 1 სხვა ადგილას. სინქრონიზებული საქაღალდე ცალკე ასლი არ არის: კომპიუტერზე წაშლილი ან დაზიანებული ფაილი იქაც ქრება.</desc>
