<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 374">
  <title>როგორ კეტავს End-to-end დაშიფვრა შეტყობინებას</title>
  <desc>სამი ნაბიჯი. 1: მეგობრის ტელეფონი ქმნის გასაღებების წყვილს და საჯარო გასაღებს გიგზავნით. ის შეტყობინებას კეტავს, მაგრამ ვერ ხსნის. 2: თქვენი ტელეფონი შეტყობინებას ამ გასაღებით კეტავს, კომპანიის სერვერები კი ატარებენ მონაცემებს, რომელთა წაკითხვაც არ შეუძლიათ. 3: შეტყობინებას მხოლოდ პირადი გასაღები ხსნის, რომელიც მეგობრის ტელეფონს არასდროს ტოვებს.</desc>
  <rect x="0" y="0" width="96" height="48.4" rx="8" class="box"/>
  <text x="48" y="28.2" class="t-sm t-b" text-anchor="middle">თქვენ</text>
  <rect x="122" y="0" width="96" height="48.4" rx="8" class="box"/>
  <text x="170" y="19.6" class="t-sm t-b" text-anchor="middle">კომპანიის</text>
  <text x="170" y="36.8" class="t-sm t-b" text-anchor="middle">სერვერები</text>
  <rect x="244" y="0" width="96" height="48.4" rx="8" class="box"/>
  <text x="292" y="28.2" class="t-sm t-b" text-anchor="middle">მეგობარი</text>
  <circle cx="10" cy="72.4" r="10" class="box-good"/>
  <text x="10" y="77" class="t-sm t-b" text-anchor="middle">1</text>
  <text x="28" y="77" class="t-sm">მეგობრის ტელეფონი ქმნის გასაღებების</text>
  <text x="28" y="94.2" class="t-sm">წყვილს და საჯარო გასაღებს გიგზავნით. ის</text>
  <text x="28" y="111.4" class="t-sm">შეტყობინებას კეტავს, მაგრამ ვერ ხსნის.</text>
  <line x1="48" y1="124.4" x2="48" y2="158.4" class="line line-thin line-dash"/>
  <line x1="170" y1="124.4" x2="170" y2="158.4" class="line line-thin line-dash"/>
  <line x1="292" y1="124.4" x2="292" y2="158.4" class="line line-thin line-dash"/>
  <line x1="284" y1="141.4" x2="63" y2="141.4" class="line-good"/>
  <polygon points="56,141.4 63,137.2 63,145.6" class="fill-good"/>
  <rect x="148" y="130.4" width="44" height="22" class="fill-bg"/>
  <circle cx="162" cy="140.4" r="4.5" class="line-good"/>
