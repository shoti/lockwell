  <path d="M208 357.4 V354.4 A4 4 0 0 1 216 354.4 V357.4" class="line-good"/>
  <rect x="205" y="357.4" width="14" height="10" rx="2" class="fill-good"/>
  <line x1="240" y1="359.4" x2="255" y2="359.4" class="line-good"/>
  <polygon points="262,359.4 255,363.6 255,355.2" class="fill-good"/>
