  <circle cx="10" cy="181.4" r="10" class="box-good"/>
  <text x="10" y="186" class="t-sm t-b" text-anchor="middle">2</text>
  <text x="28" y="186" class="t-sm">თქვენი ტელეფონი შეტყობინებას ამ გასაღებით</text>
  <text x="28" y="203.2" class="t-sm">კეტავს. სერვერები ატარებენ იმას, რის</text>
  <text x="28" y="220.4" class="t-sm">წაკითხვაც არ შეუძლიათ.</text>
  <line x1="48" y1="233.4" x2="48" y2="267.4" class="line line-thin line-dash"/>
  <line x1="170" y1="233.4" x2="170" y2="267.4" class="line line-thin line-dash"/>
  <line x1="292" y1="233.4" x2="292" y2="267.4" class="line line-thin line-dash"/>
