  <rect x="163" y="248.4" width="14" height="10" rx="2" class="fill-good"/>
  <circle cx="10" cy="290.4" r="10" class="box-good"/>
  <text x="10" y="295" class="t-sm t-b" text-anchor="middle">3</text>
  <text x="28" y="295" class="t-sm">შეტყობინებას მხოლოდ პირადი გასაღები</text>
  <text x="28" y="312.2" class="t-sm">ხსნის, რომელიც მეგობრის ტელეფონს</text>
  <text x="28" y="329.4" class="t-sm">არასდროს ტოვებს.</text>
  <circle cx="151" cy="358.4" r="4.5" class="line-good"/>
  <path d="M155.5 358.4 H171 M165 358.4 V363.4 M170 358.4 V362.4" class="line-good"/>
