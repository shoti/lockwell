<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 431">
  <title>ანგარიშის მიტაცების რამდენი მცდელობა შეაჩერა დაცვის თითოეულმა მეთოდმა</title>
  <desc>Google, ნიუ-იორკის უნივერსიტეტი და კალიფორნიის უნივერსიტეტი (სან-დიეგო), 2019: Google-ის ანგარიშების მიტაცების მცდელობების რა წილი შეაჩერა მეორე საფეხურის თითოეულმა მეთოდმა. ბოტების ავტომატური შეტევები: სამივემ 100% შეაჩერა. მასობრივი Phishing-ი: უსაფრთხოების გასაღები 100%, დასტური ტელეფონზე 99%, SMS-კოდი 96%. მიზნობრივი შეტევები: უსაფრთხოების გასაღები 100%, დასტური ტელეფონზე 90%, SMS-კოდი 76%.</desc>
  <text x="0" y="13" class="t-sm t-b t-muted">მიტაცების მოგერიებული მცდელობების წილი</text>
  <text x="0" y="40" class="t-b">ბოტების ავტომატური შეტევები</text>
  <text x="0" y="63" class="t-sm">სამივე მეთოდმა 100% შეაჩერა.</text>
  <text x="0" y="92" class="t-b">მასობრივი Phishing-ი</text>
  <text x="0" y="115" class="t-sm">უსაფრთხოების გასაღები</text>
  <text x="340" y="115" class="t-sm t-b t-good" text-anchor="end">100%</text>
  <rect x="0" y="122" width="340" height="8" rx="4" class="box-soft"/>
  <rect x="0" y="122" width="340" height="8" rx="4" class="fill-good"/>
  <text x="0" y="153" class="t-sm">დასტური ტელეფონზე</text>
  <text x="340" y="153" class="t-sm t-b t-info" text-anchor="end">99%</text>
  <rect x="0" y="160" width="340" height="8" rx="4" class="box-soft"/>
  <rect x="0" y="160" width="336.6" height="8" rx="4" class="fill-info"/>
  <text x="0" y="191" class="t-sm">SMS-კოდი</text>
  <text x="340" y="191" class="t-sm t-b t-warn" text-anchor="end">96%</text>
  <rect x="0" y="198" width="340" height="8" rx="4" class="box-soft"/>
  <rect x="0" y="198" width="326.4" height="8" rx="4" class="fill-warn"/>
  <text x="0" y="238" class="t-b">მიზნობრივი შეტევები</text>
  <text x="0" y="261" class="t-sm">უსაფრთხოების გასაღები</text>
  <text x="340" y="261" class="t-sm t-b t-good" text-anchor="end">100%</text>
  <rect x="0" y="268" width="340" height="8" rx="4" class="box-soft"/>
  <rect x="0" y="268" width="340" height="8" rx="4" class="fill-good"/>
  <text x="0" y="299" class="t-sm">დასტური ტელეფონზე</text>
  <text x="340" y="299" class="t-sm t-b t-info" text-anchor="end">90%</text>
  <rect x="0" y="306" width="340" height="8" rx="4" class="box-soft"/>
  <rect x="0" y="306" width="306" height="8" rx="4" class="fill-info"/>
  <text x="0" y="337" class="t-sm">SMS-კოდი</text>
  <text x="340" y="337" class="t-sm t-b t-warn" text-anchor="end">76%</text>
  <rect x="0" y="344" width="340" height="8" rx="4" class="box-soft"/>
  <rect x="0" y="344" width="258.4" height="8" rx="4" class="fill-warn"/>
  <line x1="0" y1="369" x2="340" y2="369" class="line line-thin"/>
  <text x="0" y="389" class="t-sm t-muted">Google, ნიუ-იორკის უნივერსიტეტი და კალიფორნიის</text>
  <text x="0" y="406.2" class="t-sm t-muted">უნივერსიტეტი (სან-დიეგო), 2019. საეჭვო შესვლები</text>
  <text x="0" y="423.4" class="t-sm t-muted">Google-ის ანგარიშებში.</text>
</svg>
