<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340">
  <title>ერთი გაჟონილი პაროლი, რომელსაც ყველა სხვა საიტზე ცდიან</title>
  <desc>საიტს, სადაც ოდესღაც დარეგისტრირდით, ტეხენ და თქვენი ელფოსტის მისამართი და პაროლი ჟონავს. თავდამსხმელების პროგრამა იმავე წყვილს სხვა საიტებზე ცდის. სადაც იგივე პაროლი გიყენიათ — მაგალითად, ელფოსტასა და ონლაინ მაღაზიაში — ის შედის. სადაც პაროლი განსხვავებულია — მაგალითად, ბანკში — ვერ შედის. პაროლი, რომელსაც მხოლოდ ერთ საიტზე იყენებთ, მხოლოდ ერთ კარს აღებს.</desc>
  <rect x="0" y="0" width="340" height="98.4" rx="8" class="box-bad"/>
  <text x="170" y="22" class="t-b t-bad" text-anchor="middle">ერთ საიტს ტეხენ</text>
  <text x="170" y="42" class="t-sm" text-anchor="middle">თქვენი ელფოსტის მისამართი და პაროლი</text>
  <text x="170" y="59.2" class="t-sm" text-anchor="middle">მილიონობით სხვა ჩანაწერთან ერთად ჟონავს:</text>
