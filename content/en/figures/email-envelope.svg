<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 304">
  <title>What end-to-end encrypted email hides, and what it doesn’t</title>
  <desc>The envelope: providers can see it, even with end-to-end encryption From: you@example.org; To: editor@example.net; Sent: 12 November 2026, 09:14; Subject: Documents from Friday; Sender’s IP address: with some providers. The message itself: end-to-end encryption can hide it</desc>
  <text x="0" y="12.5" class="t-sm t-b t-bad">The envelope: providers can see it, even with end-to-end</text>
  <text x="0" y="29.6" class="t-sm t-b t-bad">encryption</text>
  <rect x="0" y="40.3" width="340" height="159.8" rx="6" class="box-bad"/>
  <path d="M1 41.3 L170 74.3 L339 41.3" class="line-bad line-thin"/>
  <text x="14" y="97.4" class="t-sm t-b">From:</text>
  <text x="51.2" y="97.4" class="t-sm">you@example.org</text>
  <text x="14" y="118.6" class="t-sm t-b">To:</text>
  <text x="35.7" y="118.6" class="t-sm">editor@example.net</text>
  <text x="14" y="139.7" class="t-sm t-b">Sent:</text>
  <text x="48.1" y="139.7" class="t-sm">12 November 2026, 09:14</text>
  <text x="14" y="160.9" class="t-sm t-b">Subject:</text>
  <text x="65.5" y="160.9" class="t-sm">Documents from Friday</text>
  <text x="14" y="182" class="t-sm t-b">Sender’s IP address:</text>
  <text x="137.7" y="182" class="t-sm">with some providers</text>
  <text x="0" y="228.6" class="t-sm t-b t-good">The message itself: end-to-end encryption can hide it</text>
  <rect x="0" y="239.3" width="340" height="64" rx="6" class="box-good"/>
  <rect x="14" y="257.3" width="36" height="28" rx="6" class="fill-bg"/>
  <path d="M28 270.3 V267.3 A4 4 0 0 1 36 267.3 V270.3" class="line-good"/>
  <rect x="25" y="270.3" width="14" height="10" rx="2" class="fill-good"/>
  <rect x="64" y="255.3" width="250" height="5" rx="2.5" class="fill-good"/>
  <rect x="64" y="268.3" width="250" height="5" rx="2.5" class="fill-good"/>
  <rect x="64" y="281.3" width="150" height="5" rx="2.5" class="fill-good"/>
</svg>
