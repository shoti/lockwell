<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 246">
  <title>Two redactions that look the same</title>
  <desc>On screen, both look the same. Select and copy what is under the box: A box drawn on top: Source’s name. The text is still in the file. A redaction tool: Nothing. The text was removed.</desc>
  <text x="0" y="14.4" class="t-b t-bad">A box drawn on top</text>
  <text x="180" y="14.4" class="t-b t-good">A redaction tool</text>
  <rect x="0" y="25.8" width="160" height="84" rx="4" class="box"/>
  <rect x="14" y="39.8" width="120" height="4" rx="2" class="fill-muted"/>
  <rect x="11" y="51.8" width="138" height="14" rx="2" class="fill-ink"/>
  <rect x="14" y="73.8" width="110" height="4" rx="2" class="fill-muted"/>
  <rect x="14" y="90.8" width="90" height="4" rx="2" class="fill-muted"/>
  <rect x="180" y="25.8" width="160" height="84" rx="4" class="box"/>
  <rect x="194" y="39.8" width="120" height="4" rx="2" class="fill-muted"/>
  <rect x="191" y="51.8" width="138" height="14" rx="2" class="fill-ink"/>
  <rect x="194" y="73.8" width="110" height="4" rx="2" class="fill-muted"/>
  <rect x="194" y="90.8" width="90" height="4" rx="2" class="fill-muted"/>
  <text x="170" y="130.3" class="t-sm t-muted" text-anchor="middle">On screen, both look the same.</text>
  <line x1="80" y1="141" x2="80" y2="156" class="line"/>
  <polygon points="80,163 84.2,156 75.8,156" class="fill-muted"/>
  <line x1="260" y1="141" x2="260" y2="156" class="line"/>
  <polygon points="260,163 264.2,156 255.8,156" class="fill-muted"/>
  <rect x="0" y="167" width="160" height="78.1" rx="8" class="box-bad"/>
  <text x="80" y="191.4" class="t-b t-bad" text-anchor="middle">Source’s name</text>
  <text x="80" y="213.2" class="t-sm" text-anchor="middle">The text is still in the</text>
  <text x="80" y="230.4" class="t-sm" text-anchor="middle">file</text>
  <rect x="180" y="167" width="160" height="78.1" rx="8" class="box-good"/>
  <text x="260" y="191.4" class="t-b t-good" text-anchor="middle">Nothing</text>
  <text x="260" y="213.2" class="t-sm" text-anchor="middle">The text was removed</text>
</svg>
