<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 203">
  <title>How a third-party cookie follows you from site to site</title>
  <desc>News site, Online shop, Recipe site. ads.example recognises you on all three sites and links what you do on each. Blocking third-party cookies weakens these links.</desc>
  <rect x="0" y="0" width="104" height="67.2" rx="8" class="box"/>
  <text x="52" y="22.5" class="t-sm t-b" text-anchor="middle">News site</text>
  <rect x="8" y="35.2" width="87.9" height="22" rx="11" class="box-warn"/>
  <text x="52" y="50.7" class="t-sm t-warn" text-anchor="middle">ads.example</text>
  <rect x="118" y="0" width="104" height="67.2" rx="8" class="box"/>
  <text x="170" y="22.5" class="t-sm t-b" text-anchor="middle">Online shop</text>
  <rect x="126" y="35.2" width="87.9" height="22" rx="11" class="box-warn"/>
  <text x="170" y="50.7" class="t-sm t-warn" text-anchor="middle">ads.example</text>
  <rect x="236" y="0" width="104" height="67.2" rx="8" class="box"/>
  <text x="288" y="22.5" class="t-sm t-b" text-anchor="middle">Recipe site</text>
  <rect x="244" y="35.2" width="87.9" height="22" rx="11" class="box-warn"/>
  <text x="288" y="50.7" class="t-sm t-warn" text-anchor="middle">ads.example</text>
  <line x1="52" y1="69.2" x2="134.1" y2="106.3" class="line-warn line-dash"/>
  <polygon points="140.5,109.2 135.9,102.4 132.4,110.1" class="fill-warn"/>
  <line x1="170" y1="69.2" x2="170" y2="102.2" class="line-warn line-dash"/>
  <polygon points="170,109.2 174.2,102.2 165.8,102.2" class="fill-warn"/>
  <line x1="288" y1="69.2" x2="205.9" y2="106.3" class="line-warn line-dash"/>
  <polygon points="199.5,109.2 207.6,110.1 204.1,102.4" class="fill-warn"/>
  <rect x="0" y="111.2" width="340" height="63.6" rx="8" class="box-bad"/>
  <text x="170" y="137.6" class="t-b" text-anchor="middle">ads.example recognises you on all three sites</text>
  <text x="170" y="157.4" class="t-b" text-anchor="middle">and links what you do on each.</text>
  <circle cx="10" cy="193.8" r="9" class="box-good"/>
  <path d="M6 193.8 L9.1 196.9 L14.5 190.6" class="line-good"/>
  <text x="28" y="197.2" class="t-sm t-good">Blocking third-party cookies weakens these links.</text>
</svg>
