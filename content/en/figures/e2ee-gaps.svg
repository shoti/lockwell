<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 435">
  <title>Five places end-to-end encryption does not reach</title>
  <desc>The message is protected on its way between your phone and your friend’s phone. Five places are outside that protection. 1, the phone itself: whoever unlocks it, or spyware on it, reads the chats. 2, a backup: a second copy outside the app, readable unless it is encrypted too. 3, a linked device: every new message goes there as well. 4, the people in the chat: they can screenshot or forward, and someone can be added by mistake. 5, the envelope: who you write to, when and how often.</desc>
  <rect x="0" y="12" width="92" height="58" rx="8" class="box"/>
  <rect x="248" y="12" width="92" height="58" rx="8" class="box"/>
  <text x="46" y="45.6" class="t-sm t-b" text-anchor="middle">Your phone</text>
  <text x="294" y="37" class="t-sm t-b" text-anchor="middle">Your friend’s</text>
  <text x="294" y="54.2" class="t-sm t-b" text-anchor="middle">phone</text>
  <line x1="96" y1="32" x2="244" y2="32" class="line-good"/>
  <rect x="144" y="18" width="52" height="28" class="fill-bg"/>
  <rect x="148" y="20" width="44" height="24" rx="12" class="box-good"/>
  <path d="M166 30 V27 A4 4 0 0 1 174 27 V30" class="line-good"/>
  <rect x="163" y="30" width="14" height="10" rx="2" class="fill-good"/>
  <text x="170" y="62" class="t-sm t-good" text-anchor="middle">protected on the way</text>
  <circle cx="92" cy="12" r="10" class="box-bad"/>
  <text x="92" y="16.6" class="t-sm t-b t-bad" text-anchor="middle">1</text>
  <circle cx="248" cy="12" r="10" class="box-bad"/>
  <text x="248" y="16.6" class="t-sm t-b t-bad" text-anchor="middle">4</text>
  <circle cx="198" cy="20" r="10" class="box-bad"/>
  <text x="198" y="24.6" class="t-sm t-b t-bad" text-anchor="middle">5</text>
  <path d="M24 70 V104" class="line line-dash"/>
  <path d="M62 70 V90 H258 V104" class="line line-dash"/>
  <rect x="0" y="104" width="144" height="31.2" rx="8" class="box-soft"/>
  <text x="72" y="123.6" class="t-sm t-b" text-anchor="middle">Backup</text>
  <circle cx="144" cy="104" r="10" class="box-bad"/>
  <text x="144" y="108.6" class="t-sm t-b t-bad" text-anchor="middle">2</text>
  <rect x="186" y="104" width="144" height="31.2" rx="8" class="box-soft"/>
  <text x="258" y="123.6" class="t-sm t-b" text-anchor="middle">Linked device</text>
  <circle cx="330" cy="104" r="10" class="box-bad"/>
  <text x="330" y="108.6" class="t-sm t-b t-bad" text-anchor="middle">3</text>
  <line x1="0" y1="153.2" x2="340" y2="153.2" class="line line-thin"/>
  <circle cx="10" cy="179.2" r="10" class="box-bad"/>
  <text x="10" y="183.8" class="t-sm t-b t-bad" text-anchor="middle">1</text>
  <text x="28" y="183.8" class="t-sm t-b">The phone itself</text>
  <text x="28" y="201" class="t-sm">Whoever unlocks it, or spyware on it, reads the</text>
  <text x="28" y="218.2" class="t-sm">chats.</text>
  <circle cx="10" cy="240.2" r="10" class="box-bad"/>
  <text x="10" y="244.8" class="t-sm t-b t-bad" text-anchor="middle">2</text>
  <text x="28" y="244.8" class="t-sm t-b">A backup</text>
  <text x="28" y="262" class="t-sm">A second copy outside the app, readable unless it is</text>
  <text x="28" y="279.2" class="t-sm">encrypted too.</text>
  <circle cx="10" cy="301.2" r="10" class="box-bad"/>
  <text x="10" y="305.8" class="t-sm t-b t-bad" text-anchor="middle">3</text>
  <text x="28" y="305.8" class="t-sm t-b">A linked device</text>
  <text x="28" y="323" class="t-sm">Every new message goes there as well.</text>
  <circle cx="10" cy="345" r="10" class="box-bad"/>
  <text x="10" y="349.6" class="t-sm t-b t-bad" text-anchor="middle">4</text>
  <text x="28" y="349.6" class="t-sm t-b">The people in the chat</text>
  <text x="28" y="366.8" class="t-sm">They can screenshot or forward, and someone can</text>
  <text x="28" y="384" class="t-sm">be added by mistake.</text>
  <circle cx="10" cy="406" r="10" class="box-bad"/>
  <text x="10" y="410.6" class="t-sm t-b t-bad" text-anchor="middle">5</text>
  <text x="28" y="410.6" class="t-sm t-b">The envelope</text>
  <text x="28" y="427.8" class="t-sm">Who you write to, when and how often.</text>
</svg>
