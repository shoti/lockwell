<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340">
  <title>One leaked password, tried on every other site</title>
  <desc>A site you once signed up to is breached and your email address and password leak. Attackers’ software tries the same pair on other sites. Where you reused the password, such as your email and a shop, it gets in. Where the password is different, such as your bank, it fails. A password used on one site only opens one door.</desc>
  <rect x="0" y="0" width="340" height="98.4" rx="8" class="box-bad"/>
  <text x="170" y="22" class="t-b t-bad" text-anchor="middle">One site is breached</text>
  <text x="170" y="42" class="t-sm" text-anchor="middle">Your email address and password leak with</text>
  <text x="170" y="59.2" class="t-sm" text-anchor="middle">millions of others:</text>
  <rect x="62.9" y="67.4" width="214.2" height="26" rx="13" class="box"/>
  <text x="170" y="84.9" class="t-sm t-b" text-anchor="middle">nino@example.com · Tbilisi2019</text>
  <line x1="170" y1="102.4" x2="170" y2="136.4" class="line"/>
  <rect x="20" y="140.4" width="300" height="23.2" class="fill-bg"/>
  <text x="170" y="154.4" class="t-sm t-muted" text-anchor="middle">Software tries the same pair on other sites</text>
  <line x1="170" y1="161.6" x2="170" y2="161.6" class="line"/>
  <line x1="52" y1="161.6" x2="288" y2="161.6" class="line"/>
  <line x1="52" y1="161.6" x2="52" y2="172.6" class="line"/>
  <polygon points="52,179.6 47.8,172.6 56.2,172.6" class="fill-muted"/>
  <line x1="170" y1="161.6" x2="170" y2="172.6" class="line"/>
  <polygon points="170,179.6 165.8,172.6 174.2,172.6" class="fill-muted"/>
  <line x1="288" y1="161.6" x2="288" y2="172.6" class="line"/>
  <polygon points="288,179.6 283.8,172.6 292.2,172.6" class="fill-muted"/>
  <rect x="0" y="181.6" width="104" height="116.8" rx="8" class="box-bad"/>
  <text x="52" y="201.6" class="t-sm t-b" text-anchor="middle">Your email</text>
  <path d="M48 219.8 V215.8 A4 4 0 0 1 56 215.8" class="line-bad"/>
  <rect x="45" y="219.8" width="14" height="10" rx="2" class="fill-bad"/>
  <text x="52" y="248.8" class="t-sm t-b t-bad" text-anchor="middle">Gets in</text>
  <text x="52" y="266" class="t-sm" text-anchor="middle">same password</text>
  <rect x="118" y="181.6" width="104" height="116.8" rx="8" class="box-bad"/>
  <text x="170" y="201.6" class="t-sm t-b" text-anchor="middle">A shop</text>
  <path d="M166 219.8 V215.8 A4 4 0 0 1 174 215.8" class="line-bad"/>
  <rect x="163" y="219.8" width="14" height="10" rx="2" class="fill-bad"/>
  <text x="170" y="248.8" class="t-sm t-b t-bad" text-anchor="middle">Gets in</text>
  <text x="170" y="266" class="t-sm" text-anchor="middle">same password</text>
  <rect x="236" y="181.6" width="104" height="116.8" rx="8" class="box-good"/>
  <text x="288" y="201.6" class="t-sm t-b" text-anchor="middle">Your bank</text>
  <path d="M284 219.8 V216.8 A4 4 0 0 1 292 216.8 V219.8" class="line-good"/>
  <rect x="281" y="219.8" width="14" height="10" rx="2" class="fill-good"/>
  <text x="288" y="248.8" class="t-sm t-b t-good" text-anchor="middle">Kept out</text>
  <text x="288" y="266" class="t-sm" text-anchor="middle">different</text>
  <text x="288" y="283.2" class="t-sm" text-anchor="middle">password</text>
  <line x1="0" y1="312.4" x2="340" y2="312.4" class="line line-thin"/>
  <text x="0" y="332.4" class="t-sm t-muted">A password used on one site only opens one door.</text>
</svg>
