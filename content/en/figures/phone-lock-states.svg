<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 365">
  <title>Why switching off protects more than locking the screen</title>
  <desc>Switched off, or restarted and not yet unlocked: Most data stays locked until you enter your passcode. Unlocked: The data is open to whoever holds the phone. Screen locked again, after the first unlock: Much of the data stays readable in memory. Forensic tools work much better on a phone in this state. You enter the passcode, The screen locks, Switch off fully.</desc>
  <rect x="0" y="0" width="290" height="100.9" rx="8" class="box-good"/>
  <text x="12" y="26.4" class="t-b t-good">Switched off, or restarted and not yet</text>
  <text x="12" y="46.2" class="t-b t-good">unlocked</text>
  <text x="12" y="67.1" class="t-sm">Most data stays locked until you enter your</text>
  <text x="12" y="84.2" class="t-sm">passcode.</text>
  <line x1="40" y1="102.9" x2="40" y2="123.9" class="line"/>
  <polygon points="40,130.9 44.2,123.9 35.8,123.9" class="fill-muted"/>
  <text x="52" y="120.8" class="t-sm">You enter the passcode</text>
  <rect x="0" y="132.9" width="290" height="81.1" rx="8" class="box-bad"/>
  <text x="12" y="159.3" class="t-b t-bad">Unlocked</text>
  <text x="12" y="180.2" class="t-sm">The data is open to whoever holds the</text>
  <text x="12" y="197.4" class="t-sm">phone.</text>
  <line x1="40" y1="216" x2="40" y2="237" class="line"/>
  <polygon points="40,244 44.2,237 35.8,237" class="fill-muted"/>
  <text x="52" y="233.9" class="t-sm">The screen locks</text>
  <rect x="0" y="246" width="290" height="118.1" rx="8" class="box-warn"/>
  <text x="12" y="272.4" class="t-b t-warn">Screen locked again, after the first</text>
  <text x="12" y="292.2" class="t-b t-warn">unlock</text>
  <text x="12" y="313.1" class="t-sm">Much of the data stays readable in memory.</text>
  <text x="12" y="330.3" class="t-sm">Forensic tools work much better on a phone</text>
  <text x="12" y="347.4" class="t-sm">in this state.</text>
  <polyline points="292,305.1 328,305.1 328,50.5 301,50.5" class="line-good"/>
  <polygon points="294,50.5 301,54.7 301,46.3" class="fill-good"/>
  <rect x="319" y="127.4" width="18" height="100.7" rx="4" class="fill-bg"/>
  <text x="332.5" y="177.8" class="t-sm t-b t-good" text-anchor="middle" transform="rotate(-90 332.5 177.8)">Switch off fully</text>
</svg>
