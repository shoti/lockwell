<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 368">
  <title>How a messaging account is taken over, and what stops it</title>
  <desc>Someone enters your phone number in the app on their own phone. The app sends the login code to you. A message asks you to pass the code on. It often comes from a friend whose account was already stolen. No PIN or password The code is enough. Your account is theirs. With a PIN or password The code alone isn’t enough. They can’t get in.</desc>
  <rect x="0" y="0" width="340" height="63.6" rx="8" class="box"/>
  <circle cx="22" cy="31.8" r="12" class="fill-muted"/>
  <text x="22" y="36.8" class="t-b t-on" text-anchor="middle">1</text>
  <text x="44" y="26.4">Someone enters your phone number in</text>
  <text x="44" y="46.2">the app on their own phone.</text>
  <line x1="170" y1="65.6" x2="170" y2="72.6" class="line"/>
  <polygon points="170,79.6 174.2,72.6 165.8,72.6" class="fill-muted"/>
  <rect x="0" y="81.6" width="340" height="43.8" rx="8" class="box"/>
  <circle cx="22" cy="103.5" r="12" class="fill-muted"/>
  <text x="22" y="108.5" class="t-b t-on" text-anchor="middle">2</text>
  <text x="44" y="108">The app sends the login code to you.</text>
  <line x1="170" y1="127.4" x2="170" y2="134.4" class="line"/>
  <polygon points="170,141.4 174.2,134.4 165.8,134.4" class="fill-muted"/>
  <rect x="0" y="143.4" width="340" height="83.4" rx="8" class="box-warn"/>
  <circle cx="22" cy="185.1" r="12" class="fill-warn"/>
  <text x="22" y="190.1" class="t-b t-on" text-anchor="middle">3</text>
  <text x="44" y="169.8">A message asks you to pass the code on.</text>
  <text x="44" y="189.6">It often comes from a friend whose</text>
  <text x="44" y="209.4">account was already stolen.</text>
  <polyline points="170,228.8 170,236.8 82,236.8 82,239.8" class="line-bad"/>
  <polygon points="82,246.8 86.2,239.8 77.8,239.8" class="fill-bad"/>
  <polyline points="170,236.8 258,236.8 258,239.8" class="line-good"/>
  <polygon points="258,246.8 262.2,239.8 253.8,239.8" class="fill-good"/>
  <rect x="0" y="248.8" width="164" height="119.1" rx="8" class="box-bad"/>
  <text x="12" y="275.2" class="t-b t-bad">No PIN or password</text>
  <text x="12" y="297.1" class="t-sm">The code is enough.</text>
  <text x="12" y="314.2" class="t-sm">Your account is theirs.</text>
  <rect x="176" y="248.8" width="164" height="119.1" rx="8" class="box-good"/>
  <text x="188" y="275.2" class="t-b t-good">With a PIN or</text>
  <text x="188" y="295" class="t-b t-good">password</text>
  <text x="188" y="316.9" class="t-sm">The code alone isn’t</text>
  <text x="188" y="334" class="t-sm">enough. They can’t get</text>
  <text x="188" y="351.2" class="t-sm">in.</text>
</svg>
